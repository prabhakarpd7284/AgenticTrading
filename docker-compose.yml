version: "3.9"

# ⚠️  DEPRECATED for local dev — kept as the base for `docker-compose.prod.yml`.
#
# For local development use:
#   docker compose -f docker-compose.dev.yml up -d   # Postgres + Redis only
#   bash scripts/dev_up.sh                            # native backend + celery + vite
#
# The backend/worker/frontend services here pre-date the Phase-3/4/8 redesign:
# the Dockerfiles still pip-install from a now-defunct requirements/ directory
# and reference settings modules from the two-port era. They will be rebuilt
# during the deferred Phase 9 (deployment infra) work.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alphadesk
      POSTGRES_PASSWORD: alphadesk
      POSTGRES_DB: alphadesk
    ports: ["5436:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphadesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://alphadesk:alphadesk@postgres:5432/alphadesk
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://alphadesk:alphadesk@postgres:5432/alphadesk
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on: [backend]
    volumes: ["./backend:/app"]

  beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://alphadesk:alphadesk@postgres:5432/alphadesk
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on: [backend]
    volumes: ["./backend:/app"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
