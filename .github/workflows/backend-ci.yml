name: backend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docker/backend.Dockerfile"
      - "docker/worker.Dockerfile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend.Dockerfile"
      - "docker/worker.Dockerfile"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  id-token: write     # for OIDC -> AWS

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}     # e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO_BACKEND: alphadesk/backend
  ECR_REPO_WORKER:  alphadesk/worker

jobs:

  # ---------- 1. lint + unit tests ----------
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alphadesk
          POSTGRES_PASSWORD: alphadesk
          POSTGRES_DB: alphadesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alphadesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      # Drift gate: the prod image is built from uv.lock, so the lock MUST stay
      # in sync with pyproject. This is what caught (and now prevents) the
      # missing-broker-SDK regression in the container.
      - name: Lockfile in sync with pyproject
        working-directory: backend
        run: |
          pip install --no-cache-dir uv
          uv lock --check

      - name: Install
        working-directory: backend
        run: |
          pip install -r requirements/dev.txt

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Black --check
        working-directory: backend
        run: black --check .

      - name: Mypy (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: mypy apps config

      - name: Django check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://alphadesk:alphadesk@localhost:5432/alphadesk_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-key
        run: python manage.py check

      - name: Migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://alphadesk:alphadesk@localhost:5432/alphadesk_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-key
        run: python manage.py migrate --noinput

      - name: Pytest
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://alphadesk:alphadesk@localhost:5432/alphadesk_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-key
        run: pytest -q --cov=apps --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ---------- 2. build + push images ----------
  build-push:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build + push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      - name: Build + push worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_WORKER }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_WORKER }}:latest
          cache-from: type=gha,scope=worker
          cache-to:   type=gha,scope=worker,mode=max

  # ---------- 3. deploy to ECS (force-new-deployment) ----------
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://api.alphadesk.example.com/healthz/ready
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Run migrations FIRST, on the freshly-built image, as a one-off Fargate
      # task — before any service rolls onto the new code. The api task def
      # already carries DATABASE_URL + the app image (:latest, just pushed);
      # we only override its command. Network config is read off the live api
      # service so we don't have to hardcode subnet/SG ids. A non-zero exit
      # aborts the deploy (fail closed — never roll code onto an un-migrated DB).
      - name: Run database migrations
        run: |
          set -euo pipefail
          CLUSTER=alphadesk-prod
          NETCFG=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$CLUSTER-api" \
            --query 'services[0].networkConfiguration' --output json --region "$AWS_REGION")
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$CLUSTER-api" \
            --launch-type FARGATE \
            --network-configuration "$NETCFG" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' --output text --region "$AWS_REGION")
          echo "migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='api'].exitCode | [0]" --output text --region "$AWS_REGION")
          echo "migration exit code: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "::error::Database migration failed (exit=$EXIT) — aborting deploy"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text --region "$AWS_REGION" || true
            exit 1
          fi

      - name: Roll ECS services
        run: |
          for svc in api ws worker worker-orders beat; do
            aws ecs update-service \
              --cluster alphadesk-prod \
              --service alphadesk-prod-$svc \
              --force-new-deployment \
              --region $AWS_REGION
          done

      - name: Wait for stable
        run: |
          for svc in api ws worker worker-orders beat; do
            aws ecs wait services-stable \
              --cluster alphadesk-prod \
              --services alphadesk-prod-$svc \
              --region $AWS_REGION
          done

      - name: Smoke test
        run: |
          curl -fsS https://api.alphadesk.example.com/healthz/ready || (echo "Smoke failed" && exit 1)
