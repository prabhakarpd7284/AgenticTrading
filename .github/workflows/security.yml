name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly Monday 04:17 UTC

permissions:
  contents: read
  security-events: write

jobs:

  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Audit the SAME resolved set the image ships (derived from uv.lock), not
      # the hand-maintained requirements/prod.txt — which omitted the broker
      # SDKs / yfinance / OTel, so they were never CVE-scanned. (#23)
      - name: Audit the resolved (shipped) dependency set
        working-directory: backend
        run: |
          pip install pip-audit uv
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.audit.txt
          pip-audit -r requirements.audit.txt --strict

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: npm audit --audit-level=high || true

  trivy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
