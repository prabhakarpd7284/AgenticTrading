[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadesk-backend"
version = "0.1.0"
description = "AlphaDesk — AI trading desk backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "drf-spectacular>=0.27",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
    "django-environ>=0.11",
    "argon2-cffi>=23.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sentry-sdk>=2.6",
    "opentelemetry-distro>=0.46b0",
    "opentelemetry-instrumentation-django>=0.46b0",
    "langgraph>=0.6",
    "anthropic>=0.34",
    "pgvector>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.3",
    "stripe>=10.0",
    "razorpay>=1.4",
    "boto3>=1.34",
    "cryptography>=42.0",
    "pyotp>=2.9",
    "logzero>=1.7",
    # Legacy CLI commands at `trading/management/commands/*` flow through
    # trading.services.data_service which imports SmartApi at module load.
    # The ops console (apps.system.consumers.OpsConsumer) spawns those
    # commands as subprocesses using this venv's Python, so the runtime
    # deps need to be reachable from here too.
    "smartapi-python>=1.5.5",
    "websocket-client>=1.5",   # smartapi-python's optional dep, but its
                               # SmartConnect import requires it at runtime.
    # Multi-broker support — plugins/broker_zerodha + plugins/broker_fyers.
    # Pinned loosely; both SDKs are read-only here (positions, holdings,
    # funds) so minor-version drift is low-risk.
    "kiteconnect>=3.9",
    "fyers-apiv3>=3.1",
    "python-dotenv>=1.0",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.7",
    # apps.market_data.services.pulse_service uses yfinance for the
    # NIFTY/BANKNIFTY/VIX/S&P-500 quotes that feed /market-data/pulse/
    # (and downstream /rotation, /shortlist, /setup). Without it, the
    # service returns its empty fallback and the Pulse page is blank.
    "yfinance>=0.2",
    # Flower — Celery monitoring dashboard (http://localhost:5555). Booted by
    # scripts/dev_up.sh alongside the worker + beat; read-only ops surface
    # (task history, worker state, queue depth). Harmless in prod but only
    # started locally.
    "flower>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "ipython>=8.25",
    "schemathesis>=3.30",
]

[project.entry-points."alphadesk.strategies"]
directional = "plugins.strategy_directional.strategy:DirectionalStrategy"
short_straddle = "plugins.strategy_short_straddle.strategy:ShortStraddleStrategy"
vertical_spread = "plugins.strategy_vertical_spread.strategy:VerticalSpreadStrategy"
pyramid = "plugins.strategy_pyramid:PyramidStrategy"
scalp = "plugins.strategy_scalp:ScalpStrategy"
intraday_screener = "plugins.strategy_screener:ScreenerStrategy"
swing_scanner = "plugins.strategy_swing:SwingScannerStrategy"
swing_scanner_v2 = "plugins.strategy_swing.v2.plugin:SwingScannerV2Strategy"
premarket_basket = "plugins.strategy_basket:PremarketBasketStrategy"
backtest = "plugins.strategy_backtest:BacktestStrategy"

[project.entry-points."alphadesk.retrievers"]
portfolio = "apps.rag.retrievers.portfolio:PortfolioRetriever"
journal = "apps.rag.retrievers.journal:JournalRetriever"
news = "apps.rag.retrievers.news:NewsRetriever"

[project.entry-points."alphadesk.brokers"]
angel_one = "plugins.broker_angel.adapter:AngelOneAdapter"
zerodha = "plugins.broker_zerodha.adapter:ZerodhaAdapter"
fyers = "plugins.broker_fyers.adapter:FyersAdapter"
paper = "apps.market_data.adapters.paper:PaperBrokerAdapter"

[tool.setuptools.packages.find]
include = ["apps*", "config*", "plugins*"]
exclude = ["logs*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "A", "C4", "DJ", "PT"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
